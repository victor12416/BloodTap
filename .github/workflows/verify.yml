name: Verify restored baseline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m simulator.verify
      - run: python -B -m unittest discover -s alpha -p "test_*.py"
